<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tạo link mời khách · Chu Vinh &amp; Vũ Lan</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #fbf9f4; --ink: #3f4a37; --soft: #6d7563; --gold: #a8742e; --line: rgba(111,138,90,.28); --ok: #2f7a3b; }
    * { box-sizing: border-box; }
    html { background: #e9ece2; }
    body { margin: 0; font-family: "Be Vietnam Pro", system-ui, sans-serif; font-weight: 300; color: var(--ink); background: #e9ece2; line-height: 1.55; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
    h1 { font-family: "Great Vibes", cursive; font-weight: 400; color: var(--gold); font-size: 2.6rem; margin: 0; text-align: center; line-height: 1.2; }
    .sub { text-align: center; color: var(--soft); margin: .2rem 0 1.6rem; font-size: .9rem; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 12px 30px -20px rgba(0,0,0,.3); margin-bottom: 16px; }
    label { display: grid; gap: 6px; font-size: .82rem; font-weight: 500; color: var(--soft); margin-bottom: 14px; }
    label small { font-weight: 300; }
    input, textarea, select { width: 100%; font: inherit; font-size: .95rem; font-weight: 400; color: var(--ink); padding: .7rem .85rem; border-radius: 12px; border: 1px solid var(--line); background: #fff; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(168,116,46,.15); }
    textarea { resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 180px; gap: 12px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border: 0; border-radius: 999px; padding: .65rem 1.2rem; background: var(--gold); color: #fffaf0; font: inherit; font-weight: 600; font-size: .8rem; letter-spacing: .06em; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn.ghost { background: transparent; color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
    .btn.sm { padding: .45rem .8rem; font-size: .74rem; }
    .btn.done { background: var(--ok); color: #fff; box-shadow: none; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .bar b { font-weight: 600; }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; }
    .item .name { font-weight: 600; }
    .item .link { grid-column: 1; font-size: .78rem; color: var(--soft); word-break: break-all; }
    .item .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .empty { text-align: center; color: var(--soft); font-size: .88rem; padding: 18px 0; }
    .hint { font-size: .78rem; color: var(--soft); margin: -6px 0 14px; }
    code { background: #eef2e7; padding: .1rem .35rem; border-radius: 6px; font-size: .85em; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: rgba(30,25,22,.92); color: #fff; padding: .6rem 1.1rem; border-radius: 999px; font-size: .85rem; opacity: 0; pointer-events: none; transition: all .3s; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
      .item { grid-template-columns: 1fr; }
      .item .acts { grid-column: 1; grid-row: auto; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Tạo link mời khách</h1>
    <p class="sub">Mỗi khách một link riêng: thiệp sẽ hiện "Kính gửi + tên" và điền sẵn tên vào form xác nhận.</p>

    <div class="card">
      <div class="row">
        <label>Link thiệp
          <input id="base" spellcheck="false">
        </label>
        <label>Màu thiệp khi mở
          <select id="mau">
            <option value="">Mặc định (Trắng)</option>
            <option value="trang">Trắng</option>
            <option value="do">Đỏ</option>
          </select>
        </label>
      </div>
      <label>Danh sách khách <small>(mỗi dòng một khách, ví dụ: Anh Tuấn và gia đình)</small>
        <textarea id="names" rows="7" placeholder="Anh Tuấn và gia đình&#10;Chị Hoa&#10;Cô chú Bình"></textarea>
      </label>
      <label>Lời nhắn gửi kèm <small>(dùng <code>{ten}</code> cho tên khách, <code>{link}</code> cho link)</small>
        <textarea id="msg" rows="3"></textarea>
      </label>
      <p class="hint">Danh sách được lưu tạm trên trình duyệt này để lần sau mở lại không phải gõ lại.</p>
    </div>

    <div class="card">
      <div class="bar">
        <span><b id="count">0</b> khách</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn ghost sm" type="button" id="copyLinks">Sao chép tất cả link</button>
          <button class="btn sm" type="button" id="copyMsgs">Sao chép tất cả lời nhắn</button>
        </span>
      </div>
      <ul class="list" id="list"></ul>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    "use strict";
    var $ = function (id) { return document.getElementById(id); };
    var DEFAULT_MSG = "Trân trọng kính mời {ten} tới dự lễ cưới của Chu Vinh & Vũ Lan (28–29/11/2026). Thiệp mời: {link}";
    function load(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
    function save(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 1800); }

    // Link thiệp mặc định = thư mục chứa trang này (index.html)
    $("base").value = load("tl-base", new URL("./", location.href).href);
    $("mau").value = load("tl-mau", "");
    $("names").value = load("tl-names", "");
    $("msg").value = load("tl-msg", DEFAULT_MSG);

    // Dấu cách -> "+" cho link gọn; chữ có dấu vẫn mã hoá chuẩn
    function enc(s) { return encodeURIComponent(s).replace(/%20/g, "+"); }
    function linkFor(name) {
      var base = $("base").value.trim();
      var q = "khach=" + enc(name) + ($("mau").value ? "&mau=" + $("mau").value : "");
      return base + (base.indexOf("?") < 0 ? "?" : "&") + q;
    }
    function msgFor(name, link) { return $("msg").value.replace(/\{ten\}/g, name).replace(/\{link\}/g, link); }
    function names() {
      var seen = {};
      return $("names").value.split(/\r?\n/).map(function (s) { return s.trim().slice(0, 60); })
        .filter(function (s) { if (!s || seen[s]) return false; seen[s] = 1; return true; });
    }

    function render() {
      var list = names();
      $("count").textContent = list.length;
      $("list").innerHTML = list.length ? list.map(function (n, i) {
        var l = linkFor(n);
        return '<li class="item"><div class="name">' + esc(n) + '</div><div class="link">' + esc(l) + '</div>' +
          '<div class="acts"><button class="btn ghost sm" type="button" data-copy="link" data-i="' + i + '">Sao chép link</button>' +
          '<button class="btn sm" type="button" data-copy="msg" data-i="' + i + '">Sao chép lời nhắn</button>' +
          '<a class="btn ghost sm" href="' + esc(l) + '" target="_blank" rel="noopener">Xem thử</a></div></li>';
      }).join("") : '<li class="empty">Nhập tên khách ở trên để tạo link.</li>';
      save("tl-base", $("base").value); save("tl-mau", $("mau").value); save("tl-names", $("names").value); save("tl-msg", $("msg").value);
    }

    function copy(text, okMsg, btn) {
      function done() {
        toast(okMsg);
        if (btn) { var t = btn.textContent; btn.classList.add("done"); btn.textContent = "Đã chép ✓"; setTimeout(function () { btn.classList.remove("done"); btn.textContent = t; }, 1400); }
      }
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
      function fallback() {
        var ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { prompt("Sao chép thủ công:", text); }
        ta.remove();
      }
    }

    ["base", "mau", "names", "msg"].forEach(function (id) { $(id).addEventListener("input", render); });
    $("list").addEventListener("click", function (e) {
      var b = e.target.closest("[data-copy]"); if (!b) return;
      var n = names()[+b.dataset.i], l = linkFor(n);
      if (b.dataset.copy === "link") copy(l, "Đã chép link của " + n, b);
      else copy(msgFor(n, l), "Đã chép lời nhắn cho " + n, b);
    });
    $("copyLinks").addEventListener("click", function () {
      var list = names(); if (!list.length) return toast("Chưa có khách nào");
      copy(list.map(function (n) { return n + ": " + linkFor(n); }).join("\n"), "Đã chép " + list.length + " link");
    });
    $("copyMsgs").addEventListener("click", function () {
      var list = names(); if (!list.length) return toast("Chưa có khách nào");
      copy(list.map(function (n) { return msgFor(n, linkFor(n)); }).join("\n\n"), "Đã chép " + list.length + " lời nhắn");
    });
    render();
  })();
  </script>
</body>
</html>
